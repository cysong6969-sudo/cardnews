<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제너레이티브 아트 플레이그라운드</title>
<style>
  :root{
    --bg:#0b0c10; --panel:#16181f; --border:#262a35; --text:#eef0f3; --sub:#8b93a1;
    --accent:#9d7bff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); display:flex; min-height:100vh;
  }
  .side{
    width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    padding:24px 20px; display:flex; flex-direction:column; gap:18px; overflow-y:auto;
  }
  h1{ font-size:18px; margin:0 0 2px; }
  .sub{ color:var(--sub); font-size:12px; margin-bottom:6px; line-height:1.5; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; color:var(--sub); display:flex; justify-content:space-between; }
  .field label span.val{ color:var(--text); font-weight:600; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  select{
    background:#1e222b; color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:8px; font-size:13px;
  }
  .btn{
    border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;
    background:var(--accent); color:#fff; transition:.15s;
  }
  .btn:hover{ filter:brightness(1.12); }
  .btn.secondary{ background:#1e222b; color:var(--text); border:1px solid var(--border); }
  .row{ display:flex; gap:8px; }
  .row .btn{ flex:1; }
  .canvas-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  canvas{ background:#000; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); max-width:100%; max-height:calc(100vh - 40px); }
  .footer-note{ font-size:11px; color:var(--sub); margin-top:auto; line-height:1.6; }
</style>
</head>
<body>
  <div class="side">
    <div>
      <h1>✨ 제너레이티브 아트</h1>
      <div class="sub">슬라이더를 움직이면 실시간으로 패턴이 바뀝니다. 마음에 드는 순간을 PNG로 저장하세요.</div>
    </div>

    <div class="field">
      <label>패턴 종류</label>
      <select id="patternType">
        <option value="flowfield">플로우 필드</option>
        <option value="spiro">스피로그래프</option>
        <option value="orbit">궤도 입자</option>
      </select>
    </div>

    <div class="field">
      <label>복잡도 <span class="val" id="complexityVal">6</span></label>
      <input type="range" id="complexity" min="1" max="12" value="6">
    </div>
    <div class="field">
      <label>속도 <span class="val" id="speedVal">1.0</span></label>
      <input type="range" id="speed" min="1" max="50" value="10">
    </div>
    <div class="field">
      <label>대칭(반복) <span class="val" id="symmetryVal">6</span></label>
      <input type="range" id="symmetry" min="1" max="16" value="6">
    </div>
    <div class="field">
      <label>입자 수 <span class="val" id="countVal">400</span></label>
      <input type="range" id="count" min="50" max="1500" value="400">
    </div>
    <div class="field">
      <label>색상 팔레트</label>
      <select id="palette">
        <option value="sunset">선셋</option>
        <option value="neon">네온</option>
        <option value="ice">아이스</option>
        <option value="mono">모노크롬</option>
        <option value="rainbow">레인보우</option>
      </select>
    </div>
    <div class="field">
      <label>잔상(트레일) <span class="val" id="trailVal">0.08</span></label>
      <input type="range" id="trail" min="1" max="40" value="8">
    </div>

    <div class="row">
      <button class="btn secondary" id="randomizeBtn">🎲 랜덤</button>
      <button class="btn secondary" id="clearBtn">🧹 지우기</button>
    </div>
    <button class="btn" id="saveBtn">💾 PNG로 저장</button>

    <div class="footer-note">Tip: 패턴 종류를 바꿔가며 슬라이더를 조합해보세요. 저장은 현재 화면 그대로 캡처됩니다.</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv" width="900" height="700"></canvas>
  </div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const els = {
  patternType: document.getElementById('patternType'),
  complexity: document.getElementById('complexity'),
  speed: document.getElementById('speed'),
  symmetry: document.getElementById('symmetry'),
  count: document.getElementById('count'),
  palette: document.getElementById('palette'),
  trail: document.getElementById('trail'),
};
const vals = {
  complexityVal: document.getElementById('complexityVal'),
  speedVal: document.getElementById('speedVal'),
  symmetryVal: document.getElementById('symmetryVal'),
  countVal: document.getElementById('countVal'),
  trailVal: document.getElementById('trailVal'),
};

function updateLabels(){
  vals.complexityVal.textContent = els.complexity.value;
  vals.speedVal.textContent = (els.speed.value/10).toFixed(1);
  vals.symmetryVal.textContent = els.symmetry.value;
  vals.countVal.textContent = els.count.value;
  vals.trailVal.textContent = (els.trail.value/100).toFixed(2);
}
Object.values(els).forEach(el=>el.addEventListener('input', updateLabels));
updateLabels();

const palettes = {
  sunset: ['#ff6b5e','#ff9d5e','#ffd15e','#ff5ea0','#c85eff'],
  neon:   ['#39ff14','#00f0ff','#ff00e6','#ffe600','#ff003c'],
  ice:    ['#a0e8ff','#5ec8ff','#8fb8ff','#e0f7ff','#4fa8ff'],
  mono:   ['#ffffff','#cccccc','#999999','#666666','#e8e8e8'],
  rainbow:['#ff0000','#ff9900','#ffee00','#33ff00','#00c3ff','#7700ff','#ff00c8'],
};
function pickColor(){
  const p = palettes[els.palette.value];
  return p[Math.floor(Math.random()*p.length)];
}

let t = 0;
let particles = [];

function initParticles(){
  const n = parseInt(els.count.value,10);
  particles = [];
  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      a: Math.random()*Math.PI*2,
      hueOffset: Math.random(),
      color: pickColor(),
      orbitR: 20+Math.random()*250,
      orbitA: Math.random()*Math.PI*2,
      orbitSpeed: (Math.random()-0.5)*0.02,
    });
  }
}
initParticles();
els.count.addEventListener('change', initParticles);
els.palette.addEventListener('change', ()=>{ particles.forEach(p=>p.color = pickColor()); });

function noise(x,y,tt){
  return Math.sin(x*0.01 + tt) + Math.cos(y*0.013 - tt*1.3) + Math.sin((x+y)*0.007 + tt*0.7);
}

function drawFlowField(){
  const complexity = parseInt(els.complexity.value,10);
  const speed = parseInt(els.speed.value,10)/10;
  const sym = parseInt(els.symmetry.value,10);
  ctx.save();
  particles.forEach(p=>{
    const angle = noise(p.x*complexity*0.1, p.y*complexity*0.1, t) * Math.PI;
    p.x += Math.cos(angle)*speed*2;
    p.y += Math.sin(angle)*speed*2;
    if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;

    for(let s=0;s<sym;s++){
      const ang = (Math.PI*2/sym)*s;
      const cx = W/2, cy = H/2;
      const dx = p.x-cx, dy = p.y-cy;
      const rx = dx*Math.cos(ang)-dy*Math.sin(ang);
      const ry = dx*Math.sin(ang)+dy*Math.cos(ang);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(cx+rx, cy+ry, 1.6, 0, Math.PI*2);
      ctx.fill();
    }
  });
  ctx.restore();
}

function drawSpiro(){
  const complexity = parseInt(els.complexity.value,10);
  const speed = parseInt(els.speed.value,10)/10;
  const sym = parseInt(els.symmetry.value,10);
  const cx=W/2, cy=H/2;
  const R = 180, r = 40 + complexity*8, d = 60 + (complexity%7)*10;
  ctx.save();
  for(let s=0;s<sym;s++){
    const phase = (Math.PI*2/sym)*s;
    const angle = t*speed + phase;
    const x = (R-r)*Math.cos(angle) + d*Math.cos(((R-r)/r)*angle);
    const y = (R-r)*Math.sin(angle) - d*Math.sin(((R-r)/r)*angle);
    ctx.fillStyle = pickColor();
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(cx+x, cy+y, 2.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawOrbit(){
  const speed = parseInt(els.speed.value,10)/10;
  const sym = parseInt(els.symmetry.value,10);
  const cx=W/2, cy=H/2;
  ctx.save();
  particles.forEach(p=>{
    p.orbitA += p.orbitSpeed*speed;
    const x = Math.cos(p.orbitA)*p.orbitR;
    const y = Math.sin(p.orbitA)*p.orbitR*0.6;
    for(let s=0;s<sym;s++){
      const ang = (Math.PI*2/sym)*s;
      const rx = x*Math.cos(ang)-y*Math.sin(ang);
      const ry = x*Math.sin(ang)+y*Math.cos(ang);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(cx+rx, cy+ry, 1.8, 0, Math.PI*2);
      ctx.fill();
    }
  });
  ctx.restore();
}

function frame(){
  const trail = parseInt(els.trail.value,10)/100;
  ctx.fillStyle = `rgba(0,0,0,${trail})`;
  ctx.fillRect(0,0,W,H);

  const mode = els.patternType.value;
  if(mode==='flowfield') drawFlowField();
  else if(mode==='spiro') drawSpiro();
  else drawOrbit();

  t += 0.01;
  requestAnimationFrame(frame);
}
frame();

document.getElementById('randomizeBtn').addEventListener('click', ()=>{
  els.complexity.value = 1+Math.floor(Math.random()*12);
  els.speed.value = 1+Math.floor(Math.random()*50);
  els.symmetry.value = 1+Math.floor(Math.random()*16);
  els.trail.value = 1+Math.floor(Math.random()*40);
  const types=['flowfield','spiro','orbit'];
  els.patternType.value = types[Math.floor(Math.random()*types.length)];
  const pals = Object.keys(palettes);
  els.palette.value = pals[Math.floor(Math.random()*pals.length)];
  particles.forEach(p=>p.color = pickColor());
  updateLabels();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
});

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = `generative-art-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
